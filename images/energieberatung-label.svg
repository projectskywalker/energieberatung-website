<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wärmewerft Icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="chevGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e8792c"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#navyGrad)"/>

  <!-- ascending chevrons: abstract roofline / efficiency-arrow motif -->
  <path d="M24 66 L50 52 L76 66" fill="none" stroke="url(#chevGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M30 52 L50 40 L70 52" fill="none" stroke="url(#chevGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
  <path d="M36 38 L50 28 L64 38" fill="none" stroke="url(#chevGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- waterline / werft wave -->
  <path d="M18 79 Q 30 74, 42 79 T 66 79 T 90 79" fill="none" stroke="#f4f7fb" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Modernes Hauslogo</title>
  <desc id="desc">Abstraktes Hausdach mit zwei weiter auseinanderstehenden Monogramm-Elementen in Rot, Gelb und Grün.</desc>

  <defs>
    <linearGradient id="roofGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="55%" stop-color="#ef101d"/>
      <stop offset="100%" stop-color="#d80b18"/>
    </linearGradient>

    <linearGradient id="energyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef101d"/>
      <stop offset="24%" stop-color="#ff4a20"/>
      <stop offset="52%" stop-color="#ffd51a"/>
      <stop offset="76%" stop-color="#77c62b"/>
      <stop offset="100%" stop-color="#0b9a4b"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18"
                    flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#softShadow)">
    <path d="M125 400 L512 78 L899 400"
          stroke="url(#roofGradient)" stroke-width="72"/>

    <path d="M300 830 V490
             C300 415 346 372 420 372
             H480"
          stroke="url(#energyGradient)" stroke-width="78"/>

    <path d="M724 392 V742
             C724 816 682 854 608 854
             H560"
          stroke="url(#energyGradient)" stroke-width="78"/>
  </g>
</svg>
